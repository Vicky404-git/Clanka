[project]
name = "clanka"
version = "0.2.0"
description = "A sarcastic, local, CLI-native AI assistant"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ollama>=0.1.8",
    "rich>=13.0.0",
    "psutil>=5.9.0",
    "numpy>=2.2.6",
    "sqlite-vec>=0.1.9",
]

[project.scripts]
clanka = "main:run"

[tool.setuptools]
py-modules = ["main"]
packages = ["core"]
